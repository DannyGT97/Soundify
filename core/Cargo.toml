[package]
name = "soundify-core"
version = "0.1.0"
description = "Soundify logic, independent of Tauri and of the platform"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "soundify_core"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
fs4 = "0.13"
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
