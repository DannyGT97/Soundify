[package]
name = "soundify-core"
version = "0.1.0"
description = "Soundify logic, independent of Tauri and of the platform"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "soundify_core"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
fs4 = "0.13"
indexmap = { version = "2", features = ["serde"] }
log = { version = "0.4", features = ["std"] }
regex = "1"
# Ed25519 for the update signature (already in the tree through rustls).
ring = "0.17"
# Blocking on purpose: the updaters run on threads of their own, never inside
# the async runtime. rustls (ring) so no system OpenSSL is needed.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
lofty = "0.25"
# Soundify Connect: control between devices on the same network (blocking WebSocket, no async runtime).
tungstenite = "0.30"
mdns-sd = "0.21"

[dev-dependencies]
tempfile = "3"
